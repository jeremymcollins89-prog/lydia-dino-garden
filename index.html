<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A calm learning and creativity game for little kids. No accounts, works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Garden">
<meta name="theme-color" content="#2e1a47">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Dino Garden</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen dusk garden. Hub = Lydia's name, her dino, five portals. Rooms swap in over the same scenery. Single deliberate dusk theme. */
:root{
  --plum-deep:#2e1a47; --plum:#5a2f72; --rose:#c86a9e; --blush:#f6b3c8; --peach:#ffd9c4; --cream:#fff7f3;
  --dino:#a77be8; --dino-dark:#7d52c4; --belly:#ffc4de; --spot:#ff8fc2; --mint:#7fd8c3; --gold:#ffd27a;
  --glass:rgba(255,247,243,.14); --glass-edge:rgba(255,247,243,.34);
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --sz:clamp(84px,19vmin,180px);
  --p:clamp(68px,13.5vmin,146px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--plum-deep);color:var(--cream);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;border:none;background:none;padding:0;touch-action:none}
button:focus-visible{outline:4px solid var(--gold);outline-offset:4px}

/* ---------- scenery ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#2e1a47 0%,#4f2a69 30%,#93508a 58%,#e091ad 78%,#ffd0bd 100%)}
.sun{position:absolute;left:50%;bottom:24vh;width:58vmin;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fff0e4 0 26%,rgba(255,222,204,.75) 36%,rgba(255,200,200,.25) 52%,transparent 70%)}
#twinkles span{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cream);opacity:.2;animation:twinkle 4s ease-in-out infinite}
.hills{position:absolute;left:0;bottom:0;width:100%;height:44vh}
#bokeh span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,220,236,.35),transparent 70%);animation:drift 18s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,-5vh)}}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;z-index:1;transition:opacity .4s ease,transform .4s ease}
#app.dim{opacity:0;transform:scale(.97)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 96px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 3vh) max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
.ui-btn{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 18px);width:68px;height:68px;border-radius:50%;
  display:grid;place-items:center;background:var(--glass);border:2px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 24px rgba(20,6,38,.35)}
.ui-btn svg{width:34px;height:34px}
.ui-btn:active{transform:scale(.92)}
#homeBtn{left:max(18px,calc(env(safe-area-inset-left,0px) + 18px))}
#soundBtn{right:max(18px,calc(env(safe-area-inset-right,0px) + 18px))}
#soundBtn.off{opacity:.55}
#buddy{position:fixed;z-index:31;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(max(18px,calc(env(safe-area-inset-left,0px) + 18px)) + 78px);width:92px;height:80px;padding:0}
#buddy svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(20,6,38,.45))}
#buddy:active{transform:scale(.92)}
.talker.talk{animation:talk .34s ease-in-out infinite!important}
@keyframes talk{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4%) scale(1.03,.97)}}
#bubble{position:fixed;z-index:32;max-width:min(300px,70vw);padding:12px 16px;border-radius:22px 22px 22px 6px;background:#fff7f3;color:var(--plum-deep);font-weight:600;font-size:clamp(16px,2.3vmin,21px);line-height:1.25;
  box-shadow:0 10px 26px rgba(20,6,38,.35);pointer-events:none;opacity:0;transform:translateY(-100%) scale(.9);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.3,1.5,.5,1)}
#bubble.saying{opacity:1;transform:translateY(-100%) scale(1)}
#bubble.below{border-radius:6px 22px 22px 22px;transform:translateY(0) scale(.9);transform-origin:0 0}
#bubble.below.saying{transform:translateY(0) scale(1)}
.chips2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chips2 button{height:42px;padding:0 16px;border-radius:999px;background:rgba(255,247,243,.12);border:2px solid rgba(255,247,243,.25);font-weight:600;font-size:15px}
.chips2 button.on{background:var(--cream);color:var(--plum-deep);border-color:var(--cream)}
#potty{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 45%,rgba(255,208,189,.45),rgba(30,12,50,.82) 70%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.potty-card{display:flex;flex-direction:column;align-items:center;gap:2.4vh;animation:settle .7s cubic-bezier(.3,1.7,.5,1)}
.potty-dino{width:min(44vmin,380px)}
.potty-q{font-size:clamp(32px,6vmin,58px);font-weight:700;text-align:center;text-wrap:balance;text-shadow:0 4px 0 rgba(46,26,71,.4)}
.potty-btns{display:flex;gap:clamp(14px,3vmin,32px);flex-wrap:wrap;justify-content:center}
.potty-btns button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:clamp(150px,26vmin,240px);padding:clamp(14px,2.4vmin,22px) 24px;border-radius:32px;font-weight:700;font-size:clamp(22px,3.6vmin,34px);box-shadow:0 14px 28px rgba(20,6,38,.4)}
.potty-btns .emoji{font-size:clamp(48px,9vmin,84px)}
.potty-yes{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),transparent 45%),#7fd8c3;color:var(--plum-deep)}
.potty-later{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.45),transparent 45%),#c9a6ff;color:var(--plum-deep)}
.potty-btns button:active{transform:scale(.94)}
.potty-yes.ready{animation:ring 1.4s ease-in-out infinite}
#pgame{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;gap:1.6vh;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#bfe6ff 0%,#d7f0ff 40%,#bfe9c4 100%);color:var(--plum-deep)}
.pg-top{display:flex;align-items:center;gap:14px;flex:none}
.pg-dino{width:clamp(70px,11vmin,100px);flex:none}
.pg-status{flex:1;min-width:0;font-size:clamp(20px,3.4vmin,32px);font-weight:700;line-height:1.15}
.pg-timer{display:flex;align-items:center;gap:8px;flex:none}
.pg-timer .emoji{font-size:28px}
.pg-bar{width:clamp(90px,16vmin,170px);height:16px;border-radius:999px;background:rgba(46,26,71,.15);overflow:hidden}
.pg-bar i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff8fc2,#ffd27a);transition:width 1s linear}
.pg-done{flex:none;height:54px;padding:0 20px;border-radius:999px;background:#fff;color:var(--plum-deep);font-weight:700;font-size:18px;box-shadow:0 6px 14px rgba(46,26,71,.2)}
.pg-boards{flex:1;min-height:0;display:flex;gap:3vmin;align-items:center;justify-content:center}
.pg-side{display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .35s,opacity .35s}
.pg-side.waiting{opacity:.6;transform:scale(.94)}
.pg-label{font-size:clamp(18px,2.8vmin,26px);font-weight:700}
.pg-board{--n:6;position:relative;width:min(44vw,calc(100vh - 230px),560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:4px;padding:8px;border-radius:24px;background:#6cbf72;box-sizing:border-box;box-shadow:0 14px 30px rgba(46,26,71,.25),inset 0 0 0 4px rgba(255,255,255,.35)}
.mine .pg-board{background:#8fcf7d}
.pg-cell{position:relative;min-width:0;min-height:0;padding:0;border-radius:10px;background:#9bdc8a;box-shadow:inset 0 -4px 0 rgba(46,90,40,.18);display:grid;place-items:center;overflow:hidden}
.pg-cell:nth-child(odd){background:#a8e397}
.pg-board.active .pg-cell:not(.tried){cursor:pointer}
.pg-board.active .pg-cell:not(.tried):active{transform:scale(.9)}
.pg-cell svg{width:86%;height:86%;pointer-events:none}
.pg-cell.miss svg{animation:bloom .5s cubic-bezier(.3,1.7,.5,1)}
.pg-cell.hit{background:#ffe9a8!important}
.pg-cell.hit svg{animation:bloom .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.pg-dinos{position:absolute;inset:8px;pointer-events:none}
.pg-found{position:absolute;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,210,122,.9);animation:settle .6s cubic-bezier(.3,1.7,.5,1)}
.pg-found svg{width:96%;height:96%}
.mine .pg-found.pg-ghost{background:rgba(255,255,255,.3);box-shadow:none;animation:none;opacity:.75}
.mine .pg-found.pg-ghost.got{background:rgba(255,140,140,.35);opacity:1}
.pg-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;background:rgba(255,247,243,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;padding:20px}
.pg-end-dino{width:min(36vmin,300px)}
.pg-end-msg{font-size:clamp(28px,5vmin,48px);font-weight:700;max-width:820px;text-wrap:balance}
.pg-end-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pg-end-btns button{height:66px;padding:0 30px;border-radius:999px;font-weight:700;font-size:22px;box-shadow:0 10px 22px rgba(46,26,71,.25)}
.pg-end-btns .go{background:#7fd8c3;color:var(--plum-deep)}
.pg-end-btns .back{background:#c9a6ff;color:var(--plum-deep)}
@media (orientation:portrait){.pg-boards{flex-direction:column}.pg-board{width:min(86vw,calc((100vh - 280px)/2))}}
#setBtn{right:calc(max(18px,calc(env(safe-area-inset-right,0px) + 18px)) + 80px)}
#setBtn.needs::after{content:"";position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(46,26,71,.6);animation:ring 1.6s ease-in-out infinite}
.name .sp{width:.35em}
.set-input{height:56px;border-radius:16px;border:2px solid rgba(255,247,243,.35);background:rgba(255,247,243,.12);color:var(--cream);font:600 22px var(--display);padding:0 16px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.set-input:focus{border-color:var(--gold)}
.set-input.bad{animation:wiggle .5s ease-in-out;border-color:#ff6b6b}
.gate-q{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.set-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp-done.soft{background:rgba(255,247,243,.14);color:var(--cream)}
.set-label{font-size:15px;font-weight:600;opacity:.9;margin-bottom:-4px}
.set-sep{height:1px;background:rgba(255,247,243,.2);margin:4px 0}
.set-danger{align-self:center;height:44px;padding:0 20px;border-radius:999px;border:2px solid rgba(255,140,140,.6);color:#ffc2c2;font-weight:600;font-size:15px}
.set-danger.armed{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.set-toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:16px;font-weight:600}
.switch{flex:none;width:60px;height:34px;border-radius:999px;background:rgba(255,247,243,.22);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(20,6,38,.35);transition:transform .2s}
.switch.on{background:#7fd8c3}.switch.on::after{transform:translateX(26px)}
.set-group{display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.set-group.off{opacity:.35;pointer-events:none}
.voice-panel{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.set-foot{font-size:13px;opacity:.75;text-align:center;line-height:1.35}

/* ---------- dino ---------- */
.dino{display:block;overflow:visible;filter:drop-shadow(0 18px 18px rgba(20,6,38,.35))}
#dino .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5%) scale(1.01)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16%) scale(.96,1.05)}65%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}

/* ---------- hub ---------- */
#hub{justify-content:space-between;gap:2vh}
.name{display:flex;gap:.04em;font-size:clamp(64px,14vmin,160px);font-weight:700;line-height:1}
.name span{display:inline-block;padding:0 .02em;cursor:pointer;text-shadow:0 .06em 0 rgba(46,26,71,.45),0 0 .5em rgba(255,200,230,.35)}
.name span.bounce{animation:letter .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes letter{0%{transform:none}35%{transform:translateY(-22%) scale(1.15) rotate(-6deg)}100%{transform:none}}
.hub-dino{width:min(40vmin,370px);flex:none;cursor:pointer}
.portals{display:grid;grid-template-columns:repeat(6,auto);gap:clamp(12px,3vmin,34px);padding-bottom:1vh}
.portal{width:var(--p);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),transparent 42%),var(--c);
  box-shadow:0 16px 30px rgba(20,6,38,.45),inset 0 -10px 20px rgba(46,26,71,.22),0 0 0 7px rgba(255,247,243,.16);
  animation:float 4.6s ease-in-out infinite}
.portal:nth-child(2){animation-delay:-.8s}.portal:nth-child(3){animation-delay:-1.6s}.portal:nth-child(4){animation-delay:-2.4s}.portal:nth-child(5){animation-delay:-3.2s}.portal:nth-child(6){animation-delay:-4s}
.portal>svg{width:56%;height:56%;pointer-events:none}
.portal:active{transform:scale(.92)}
.portal .badge{position:absolute;top:-8%;right:-8%;width:42%;height:42%;opacity:0;transform:scale(0) rotate(-40deg);transition:.5s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.portal.done .badge{opacity:1;transform:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- room shared ---------- */
#roomBody{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.room-star{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;width:76px;height:76px;margin-left:-38px;
  transform:scale(0) rotate(-60deg);transition:transform .6s cubic-bezier(.3,1.7,.5,1);pointer-events:none;filter:drop-shadow(0 6px 14px rgba(255,210,122,.6))}
.room-star.show{transform:none}
.slot{width:var(--sz);aspect-ratio:1;position:relative;flex:none}
.piece{position:absolute;inset:0;z-index:2;cursor:grab;touch-action:none;filter:drop-shadow(0 12px 12px rgba(20,6,38,.45));will-change:transform}
.piece svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.piece.dragging{z-index:60;filter:drop-shadow(0 26px 22px rgba(20,6,38,.5))}
.settle{animation:settle .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes settle{0%{transform:scale(1.15)}50%{transform:scale(.92)}100%{transform:none}}
.wiggle{animation:wiggle .7s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.panel{border-radius:44px;background:var(--glass);border:2px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 24px 50px rgba(20,6,38,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:box-shadow .5s}
.panel.win{box-shadow:0 0 0 6px rgba(255,210,122,.6),0 0 70px rgba(255,210,122,.55)}

/* music */
.music{display:flex;align-items:flex-end;gap:3vmin;height:min(72vh,640px);width:min(100%,1120px);position:relative}
.music .dino{width:24vmin;flex:none}
.tubes{display:flex;align-items:flex-end;gap:clamp(6px,1.6vmin,18px);height:100%;flex:1;min-width:0}
.tube{flex:1;min-width:0;border-radius:999px 999px 30px 30px;position:relative;
  background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 30%,transparent 62%,rgba(46,26,71,.18)),var(--c);
  box-shadow:0 12px 26px rgba(20,6,38,.42);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .35s,filter .35s}
.tube::before{content:"";position:absolute;left:18%;right:18%;top:5%;height:7%;border-radius:50%;background:rgba(255,255,255,.55)}
.tube.lit{transform:translateY(-12px) scale(1.04);filter:brightness(1.15);box-shadow:0 12px 26px rgba(20,6,38,.42),0 0 46px 12px var(--c)}
.music-room{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2vh}
#roomBody.song-mode .music{height:min(56vh,520px)}
body:has(#songBtn) .room-star{left:calc(50% + 150px)}
.songbtn{position:fixed;z-index:29;top:calc(env(safe-area-inset-top,0px) + 20px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:58px;padding:0 22px 0 16px;border-radius:999px;
  background:var(--gold);color:var(--plum-deep);font-weight:700;font-size:clamp(17px,2.6vmin,22px);box-shadow:0 10px 22px rgba(20,6,38,.35)}
.songbtn .emoji{font-size:26px}
.songbtn:active{transform:translateX(-50%) scale(.94)}
.song-bar{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 18px;border-radius:28px;background:rgba(46,26,71,.55);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:100%}
.song-title{font-size:clamp(18px,2.8vmin,26px);font-weight:700}
.song-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vmin,14px)}
.sn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:clamp(34px,5.2vmin,52px);transition:transform .2s}
.sn i{width:clamp(28px,4.6vmin,46px);aspect-ratio:1;border-radius:50%;background:var(--c);opacity:.45;box-shadow:inset 0 -3px 0 rgba(46,26,71,.18);transition:opacity .2s,transform .2s}
.sn span{font-size:clamp(14px,2.2vmin,20px);font-weight:600;opacity:.75}
.sn.heard i,.sn.done i{opacity:1}
.sn.done span{opacity:1;color:var(--gold)}
.sn.now{transform:translateY(-6px)}
.sn.now i{opacity:1;transform:scale(1.25);box-shadow:0 0 0 4px #fff7f3,0 0 18px var(--c)}
.sn.now span{opacity:1}
.tubes.listening{pointer-events:none}
.tube.next{animation:nextPipe 1s ease-in-out infinite;box-shadow:0 12px 26px rgba(20,6,38,.42),0 0 0 6px #fff7f3,0 0 40px 10px var(--c)}
@keyframes nextPipe{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.tube.nudge{animation:wiggle .6s ease-in-out}
.song-pick{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(46,26,71,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:32px}

.utab{width:clamp(58px,9.5vmin,88px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;font-weight:700;font-size:clamp(17px,2.8vmin,26px);

.voicebtn{position:fixed;z-index:29;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border-radius:999px;font-weight:600;font-size:16px;

  background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 14px 28px rgba(20,6,38,.38);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .4s,box-shadow .3s}

  background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 22px 40px rgba(20,6,38,.4);text-align:center;padding:3vmin;box-sizing:border-box}

.paint-board canvas,.paint-board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.paint-board svg{pointer-events:none}
.paint-side{display:flex;flex-direction:column;gap:1.2vmin;padding:1.4vmin;border-radius:28px;flex:none;align-self:center;max-height:100%}
.pcolors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 4px 10px rgba(20,6,38,.3)}
.pc.on{box-shadow:0 0 0 4px var(--cream),0 4px 10px rgba(20,6,38,.3)}
.ptools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pt{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:rgba(255,247,243,.12);border:2px solid rgba(255,247,243,.22)}
.pt svg{width:66%;height:66%}
.pt.on{background:var(--cream);border-color:var(--cream)}
.pt.on svg [stroke="#fff7f3"]{stroke:#2e1a47}.pt.on svg [fill="#fff7f3"]{fill:#2e1a47}
.pt.clear::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:4px solid var(--gold);clip-path:inset(100% 0 0 0);pointer-events:none}
.pt.clear{position:relative}
.pt.clear.holding::after{animation:fillup .9s linear forwards}
.psizes{display:flex;justify-content:space-around;align-items:center;gap:8px}
.psz{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,247,243,.12)}
.psz i{display:block;border-radius:50%;background:var(--cream)}
.psz.on{background:var(--cream)}.psz.on i{background:var(--plum-deep)}
@media (orientation:portrait){.paint{flex-direction:column}.paint-board{height:auto;width:100%}.paint-side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-self:stretch}.pcolors{grid-template-columns:repeat(8,1fr)}.ptools{grid-template-columns:repeat(8,1fr)}}

/* build-a-run */
.build{display:flex;gap:2.2vmin;width:100%;height:100%;align-items:stretch}
.board-wrap{flex:1;min-width:0;min-height:0;position:relative}
.board-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ptray{display:grid;grid-template-columns:repeat(2,auto);gap:1.2vmin;padding:1.6vmin;align-content:center;justify-content:center;border-radius:32px;flex:none;align-self:center}
.pbtn{width:clamp(54px,9.4vmin,92px);aspect-ratio:1;border-radius:22px;background:rgba(255,247,243,.1);border:2px solid rgba(255,247,243,.22);display:grid;place-items:center;position:relative}
.pbtn svg{width:84%;height:84%;pointer-events:none;overflow:visible}
.pbtn:active{transform:scale(.92)}
.pbtn.clear::after{content:"";position:absolute;inset:-5px;border-radius:25px;border:4px solid var(--gold);clip-path:inset(100% 0 0 0);pointer-events:none}
.pbtn.clear.holding::after{animation:fillup .9s linear forwards}
@keyframes fillup{to{clip-path:inset(0 0 0 0)}}
.ghost{position:fixed;left:0;top:0;width:96px;height:96px;z-index:65;pointer-events:none;filter:drop-shadow(0 16px 16px rgba(20,6,38,.45))}
.ghost svg{width:100%;height:100%;overflow:visible;display:block}
@media (orientation:portrait){.build{flex-direction:column}.ptray{grid-template-columns:repeat(9,auto)}}
@media (orientation:portrait) and (max-width:700px){.ptray{grid-template-columns:repeat(5,auto)}}

/* matching game */
.match-bar{position:fixed;z-index:29;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  max-width:calc(100vw - 210px);overflow-x:auto;padding:4px}
.chipset{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip{height:46px;min-width:46px;padding:0 12px;border-radius:999px;font-weight:600;font-size:17px;color:var(--cream);display:grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:30px;height:30px;pointer-events:none}
.chip.on{background:var(--cream);color:var(--plum-deep);box-shadow:0 4px 12px rgba(20,6,38,.3)}
.chip.on svg [fill="#fff7f3"]{fill:var(--plum-deep)}
.chip.on svg [stroke="#fff7f3"]{stroke:var(--plum-deep)}
.chip.on svg [fill="#e4d4f4"]{fill:#7d52c4}
.mgrid{display:grid;gap:var(--gap);justify-content:center;align-content:center}
.mcard{width:var(--cs);height:var(--cs);perspective:700px;position:relative}
.mcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.3,.5,1)}
.mcard.up .inner{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:calc(var(--cs)*.2);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.mcard .back{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 45%),linear-gradient(160deg,#b98ae8,#7d52c4);
  box-shadow:0 calc(var(--cs)*.06) calc(var(--cs)*.12) rgba(20,6,38,.4),inset 0 0 0 calc(var(--cs)*.04) rgba(255,247,243,.35)}
.mcard .back svg{width:46%;height:46%;opacity:.55}
.mcard .front{transform:rotateY(180deg);background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 calc(var(--cs)*.05) calc(var(--cs)*.1) rgba(20,6,38,.35)}
.mcard .front svg{width:84%;height:84%}
.mcard.got .front{box-shadow:0 0 0 calc(var(--cs)*.05) var(--gold),0 0 calc(var(--cs)*.3) rgba(255,210,122,.7)}
.mcard.got .inner{animation:gotit .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes gotit{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.14)}100%{transform:rotateY(180deg) scale(1)}}
.mcard.free .inner{transform:rotateY(180deg)}
.mcard.free .front{background:radial-gradient(circle,#fff3c8,#ffd27a)}

/* travel + finale + confetti */
#travel{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#travel .runner{position:absolute;left:0;bottom:16vh;width:28vmin;transform:translateX(-40vmin)}
#travel .runner.go{animation:run 1.3s cubic-bezier(.45,.05,.55,.95) forwards}
#travel .runner.go svg{animation:trot .26s ease-in-out infinite}
@keyframes run{to{transform:translateX(calc(100vw + 10vmin))}}
@keyframes trot{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14%) rotate(4deg)}}
#finale{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  background:radial-gradient(circle at 50% 55%,rgba(255,208,189,.35),rgba(46,26,71,.6) 70%);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#finale .dino{width:min(50vmin,440px);animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}25%{transform:rotate(0) translateY(-10%)}50%{transform:rotate(6deg) translateY(0)}75%{transform:rotate(0) translateY(-10%)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}

@media (max-width:560px){.portals{grid-template-columns:repeat(3,auto)}.music .dino{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>

<script>
/*ENGINE-START*/
/* ---------- Marble-run engine: pure geometry + physics, no DOM. World units: one long straight tube = 1. ---------- */
const BW = 10, BH = 7.2, TW = .25, MR = .17, G = 7, MAXV = 14, BOOST = 34, SNAP = .6;
const D2R = Math.PI / 180;
const rotV = (x, y, deg) => { const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R); return [x * c - y * s, x * s + y * c]; };
const norm = a => ((Math.round(a) % 360) + 360) % 360;
const unit = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
const arcLocal = (R, a0, a1, n) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * D2R; return [R * Math.cos(a), R + R * Math.sin(a)]; });
const TYPES = {
  straight: { tube: true, line: [[0, 0], [1, 0]], ports: [{ p: [0, 0], d: 180 }, { p: [1, 0], d: 0 }], color: '#7fd8c3', note: 2, kind: 'turn' },
  short:    { tube: true, line: [[0, 0], [.5, 0]], ports: [{ p: [0, 0], d: 180 }, { p: [.5, 0], d: 0 }], color: '#8fc4ff', note: 4, kind: 'turn' },
  curve:    { tube: true, line: arcLocal(.6, -90, 0, 10), ports: [{ p: [0, 0], d: 180 }, { p: [.6, .6], d: 90 }], color: '#b994f2', note: 3, kind: 'swap' },
  bend:     { tube: true, line: arcLocal(1, -90, -45, 6), ports: [{ p: [0, 0], d: 180 }, { p: [Math.SQRT1_2, 1 - Math.SQRT1_2], d: 45 }], color: '#ff9fd0', note: 5, kind: 'swap' },
  booster:  { tube: true, booster: true, line: [[0, 0], [.6, 0]], ports: [{ p: [0, 0], d: 180 }, { p: [.6, 0], d: 0 }], color: '#ff5fa2', note: 6, kind: 'turn' },
  funnel:   { tube: true, line: [[0, 0], [.4, 0]], ports: [null, { p: [.4, 0], d: 0 }], extra: [[[-.5, -.66], [0, -TW]], [[-.5, .66], [0, TW]]], color: '#ffd27a', note: 5, kind: 'rot', rot0: 90 },
  start:    { tube: true, line: [[0, 0], [.8, 0]], ports: [null, { p: [.8, 0], d: 0 }], extra: [[[-.28, -.42], [0, -TW]], [[-.28, .42], [0, TW]]], color: '#fff7f3', fixed: true, rot0: 90 },
  bouncer:  { obstacle: true, seg: [[-.42, 0], [.42, 0]], color: '#ffb38a', note: 7, kind: 'rot' },
  bell:     { obstacle: true, circle: .24, color: '#ffd27a', note: 7 }
};
const byId = (S, id) => S.pieces.find(p => p.id === id);
function geom(pc) {
  const T = TYPES[pc.type], tr = ([x, y]) => { const [a, b] = rotV(x, y, pc.rot); return [pc.x + a, pc.y + b]; }, g = {};
  if (T.tube) {
    g.line = T.line.map(tr);
    g.ports = T.ports.map(p => p && { p: tr(p.p), d: norm(p.d + pc.rot) });
    g.extra = (T.extra || []).map(w => w.map(tr));
    g.cum = [0]; for (let i = 1; i < g.line.length; i++) g.cum.push(g.cum[i - 1] + Math.hypot(g.line[i][0] - g.line[i - 1][0], g.line[i][1] - g.line[i - 1][1]));
    g.len = g.cum[g.cum.length - 1];
  }
  if (T.seg) g.seg = T.seg.map(tr);
  if (T.circle) g.circle = { x: pc.x, y: pc.y, r: T.circle };

/* ---------------- Potty game: Dino Hide & Seek (battleship with dinos and flowers), 10 minutes total ---------------- */
const PG = { N: 6, SIZES: [3, 2, 2], MINUTES: 10 };

function pgPlace() {
  const ships = [], taken = new Set(), kinds = shuffle(PG_DINOS).slice(0, PG.SIZES.length);
  PG.SIZES.forEach((len, k) => {
    for (let tries = 0; tries < 500; tries++) {
      const h = Math.random() < .6, r = rand(h ? PG.N : PG.N - len + 1), c = rand(h ? PG.N - len + 1 : PG.N);
      const cells = Array.from({ length: len }, (_, j) => (h ? r : r + j) * PG.N + (h ? c + j : c));
      if (cells.some(i => taken.has(i))) continue;
      cells.forEach(i => taken.add(i));
      ships.push({ cells, h, r, c, len, kind: kinds[k][0], name: kinds[k][1], color: PAL[(k * 3 + rand(3)) % PAL.length], found: 0 }); break;
    }

}
function pgDinoSVG(ship) { const D = DINOS[ship.kind]; return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${D.svg(ship.color, shade(ship.color, .72))}</svg>`; }
const PG_FLOWER_COLS = [['#ff8fc2', '#ffd27a'], ['#ffd27a', '#ff6b6b'], ['#b48cf0', '#ffffff'], ['#6fb2ff', '#ffd27a'], ['#ff6b6b', '#ffd27a']];
const pgFlower = () => { const [a, b] = PG_FLOWER_COLS[rand(PG_FLOWER_COLS.length)]; return `<svg viewBox="0 0 100 100">${FLOWERS[['daisy', 'round', 'tulip'][rand(3)]](a, b)}</svg>`; };
const PG_SPARK = '<svg viewBox="0 0 100 100"><use href="#star"/></svg>';
function pgBoxStyle(ship) { const u = 100 / PG.N; return `left:${ship.c * u}%;top:${ship.r * u}%;width:${(ship.h ? ship.len : 1) * u}%;height:${(ship.h ? 1 : ship.len) * u}%`; }

/* ---------------- drag engine (shapes + eggs) ---------------- */
function draggable(el, onDrop) {
  el.addEventListener('pointerdown', e => {
    if (el.dataset.locked) return;
    e.preventDefault(); e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const base = el.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
    el.style.transition = 'none'; el.classList.add('dragging'); sfx.pick();
    const mv = ev => { el.style.transform = `translate(${ev.clientX - sx}px,${ev.clientY - sy}px) scale(1.1)`; };
    const up = ev => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.classList.remove('dragging'); onDrop(el, base, ev.clientX, ev.clientY); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
function findTarget(el, x, y, targets) {
  let best = null, bd = Infinity;
  targets.forEach(t => {
    if (t.dataset.kind !== el.dataset.kind) return;
    if ((+t.dataset.filled || 0) >= (+t.dataset.cap || 1)) return;
    const r = t.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (d < Math.max(r.width, r.height) * .85 && d < bd) { bd = d; best = t; }
  });
  return best;
}
function returnHome(el) { el.style.transition = 'transform .5s cubic-bezier(.3,1.4,.5,1)'; el.style.transform = ''; sfx.back(); }
function snapTo(el, base, target, then) {
  const r = target.getBoundingClientRect();
  const dx = r.left + r.width / 2 - (base.left + base.width / 2), dy = r.top + r.height / 2 - (base.top + base.height / 2);
  el.dataset.locked = 1; target.dataset.filled = (+target.dataset.filled || 0) + 1;
  el.style.transition = 'transform .28s cubic-bezier(.3,1.2,.5,1)'; el.style.transform = `translate(${dx}px,${dy}px) scale(1.02)`;
  sfx.snap();
  later(() => { el.style.transition = 'none'; el.style.transform = ''; then(); restart(el, 'settle'); }, 290);
}

const learn = store.get('lydia-learn', { done: {}, unit: null });
const saveLearn = () => store.set('lydia-learn', learn);
const nextIn = unitId => LESSONS.filter(l => !unitId || l.unit === unitId).find(l => !learn.done[l.id]) || null;
function showMap(unitId, finishedId) {
  clearLater();
  const firstOpen = nextIn();
  let uid = unitId || learn.unit || (firstOpen ? firstOpen.unit : 'shapes');
  if (finishedId && !nextIn(uid)) { const ui = UNITS.findIndex(u => u.id === uid); if (ui < UNITS.length - 1) { uid = UNITS[ui + 1].id; later(() => speak(`Next up: ${UNITS[ui + 1].name}!`), 300); } }
  learn.unit = uid; saveLearn();
  const U = UNITS.find(u => u.id === uid), ls = LESSONS.filter(l => l.unit === uid), nx = nextIn(uid);
  body.innerHTML = `<div class="learn-map">
    <div class="unit-tabs">${UNITS.map(u => { const all = LESSONS.filter(l => l.unit === u.id), dn = all.filter(l => learn.done[l.id]).length; return `<button class="utab ${u.id === uid ? 'on' : ''}" data-u="${u.id}" style="--c:${u.color}" aria-label="${u.name}">${u.icon}<span class="prog">${dn}/${all.length}</span></button>`; }).join('')}</div>
    <div class="unit-title">${U.name}</div><div class="unit-sub">${U.sub}</div>
    <div class="stones ${ls.length > 14 ? 'many lots' : ls.length > 8 ? 'many' : ''}">${ls.map(l => `<button class="stone ${nx && nx.id === l.id ? 'next' : ''}" data-l="${l.id}" aria-label="${l.title}"><div class="disc" style="--c:${U.color}">${l.glyph}${learn.done[l.id] ? '<svg class="badge"><use href="#star"/></svg>' : ''}</div><span class="label">${l.title}</span>${nx && nx.id === l.id ? '<svg class="here dino" viewBox="0 0 230 200"><use href="#dino"/></svg>' : ''}</button>`).join('')}</div>
  </div><button class="voicebtn" aria-label="Choose the voice">${ICON.speak}<span>Voice</span></button>`;
  $('.voicebtn', body).addEventListener('click', () => { sfx.click(); voicePanel(); });
  $$('.utab', body).forEach(b => b.addEventListener('click', () => { sfx.click(); showMap(b.dataset.u); speak(UNITS.find(u => u.id === b.dataset.u).name, true); }));
  $$('.stone', body).forEach(b => b.addEventListener('click', () => { sfx.chime(); openLesson(LESSONS.find(l => l.id === b.dataset.l)); }));
}
function openLesson(L) {
  clearLater(); hush();
  body.innerHTML = `<div class="lesson"><div class="lesson-top"><button class="lbtn" id="lBack" aria-label="Back to the path">${ICON.back}</button><div class="dots"></div><button class="lbtn" id="lSay" aria-label="Hear it again">${ICON.speak}</button></div><div class="prompt"></div><div class="stage"></div></div>`;
  let spoken = '';
  const ctx = {
    stage: $('.stage', body),
    prompt(text, say) { $('.prompt', body).textContent = text; spoken = (typeof say === 'string' && say) ? say : text; speak(spoken); },
    say(text) { spoken = text; speak(text, true); },
    setSpoken(text) { spoken = text; },
    replay: null,
    dots(i, n) { const d = $('.dots', body); if (d.children.length !== n) d.innerHTML = '<i></i>'.repeat(n); [...d.children].forEach((c, j) => c.classList.toggle('on', j < i)); },
    done() {
      learn.done[L.id] = true; saveLearn(); markDone('learn');
      bigCelebrate(); later(() => speak(`Great job${nm()}! You finished ${L.title}!`), 200);
      later(() => showMap(L.unit, L.id), 3400);
    }
  };
  $('.prompt', body).textContent = L.title;
  $('#lBack').addEventListener('click', () => { hush(); sfx.click(); showMap(L.unit); });
  $('#lSay').addEventListener('click', () => { if (ctx.replay) ctx.replay(); else speak(spoken, true); });
  L.run(ctx);
}
build.learn = () => { lullPaused = true; showMap(); cleanup = () => hush(); };

/* Eggs: put each colored egg in the nest with the matching ribbon, then they hatch */
const EGGCOL = { pink: '#ff8fc2', purple: '#a77be8', gold: '#ffd27a', mint: '#6fd3bd' };
const EGG = 'M50 6 C74 6 90 44 90 66 C90 86 72 98 50 98 C28 98 10 86 10 66 C10 44 26 6 50 6Z';
const eggSVG = c => `<svg viewBox="0 0 100 104"><path d="${EGG}" fill="${c}"/><g fill="#fff" opacity=".45"><circle cx="38" cy="50" r="7"/><circle cx="63" cy="68" r="9"/><circle cx="40" cy="80" r="5"/><circle cx="64" cy="38" r="4"/></g><path d="${EGG}" fill="url(#gShine)"/></svg>`;
const nestSVG = c => `<svg class="bowl" viewBox="0 0 200 104"><path d="M6 26 C8 78 48 102 100 102 C152 102 192 78 194 26 C160 42 40 42 6 26Z" fill="#c98b5e"/><path d="M12 46 C60 66 140 66 188 46 L183 62 C140 82 60 82 17 62Z" fill="${c}"/><g stroke="#a86c44" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"><path d="M20 34 q30 22 60 6"/><path d="M90 40 q30 18 60 -4"/><path d="M40 80 q30 14 60 2"/><path d="M110 84 q30 4 52 -14"/></g><path d="M6 26 C40 42 160 42 194 26" stroke="#e8b07e" stroke-width="10" stroke-linecap="round" fill="none"/></svg>`;
build.nests = function round() {
  const cols = shuffle(Object.keys(EGGCOL)).slice(0, 3);
  body.innerHTML = `<div class="eggs-room"><div class="nests panel"></div><div class="tray egg-tray"></div></div>`;
  const nestsBox = $('.nests', body), tray = $('.tray', body);
  const nests = cols.map(k => {
    const n = document.createElement('div'); n.className = 'nest'; n.dataset.kind = k; n.dataset.cap = 2;
    n.style.setProperty('--c', EGGCOL[k]); n.innerHTML = `<div class="slots"></div>${nestSVG(EGGCOL[k])}`;
    nestsBox.appendChild(n); return n;
  });
  let placed = 0;
  shuffle([...cols, ...cols]).forEach(k => {
    const slot = document.createElement('div'); slot.className = 'slot';
    const p = document.createElement('div'); p.className = 'piece'; p.dataset.kind = k; p.innerHTML = eggSVG(EGGCOL[k]);
    slot.appendChild(p); tray.appendChild(slot);
    draggable(p, (el, base, x, y) => {
      const t = findTarget(el, x, y, nests);
      if (!t) return returnHome(el);
      snapTo(el, base, t, () => $('.slots', t).appendChild(el));
      if (++placed === 6) later(() => {
        const eggs = $$('.nest .piece', nestsBox);
        eggs.forEach((q, i) => later(() => restart(q, 'wiggle'), i * 90));
        eggs.forEach((q, i) => later(() => {
          sfx.crack(); q.classList.add('hatched'); q.innerHTML = `<svg viewBox="0 0 230 200"><use href="#dino"/></svg>`;
          if (i === eggs.length - 1) { nestsBox.classList.add('win'); bigCelebrate(nestsBox); sfx.giggle(); markDone('nests'); }
        }, 900 + i * 220));
        later(round, 900 + eggs.length * 220 + 3200);
      }, 450);
    });
  });
};

const PAL = ['#ff8fc2', '#a77be8', '#ffb38a', '#f5c242', '#4fc4a8', '#6fb2ff', '#ff6b6b', '#9bd35a', '#d77ef0', '#6f7dff'];
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f); return '#' + ((1 << 24) + (Math.min(255, r) << 16) + (Math.min(255, g) << 8) + Math.min(255, b)).toString(16).slice(1); };
const EYE = (x, y, r = 4.2) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x + .8}" cy="${y + .4}" r="${r * .6}" fill="#2e1a47"/>`;

  /* ---- drawing ---- */
  const P = (x, y) => [ox + x * k, oy + y * k];

    if (state === 'idle') {

    }

  let last = performance.now();
  function loop(now) {

};

/* =====================================================================
   ART — color by number (Happy Color style) + paint studio
   Pictures are 1000×1000, built from regions painted back-to-front.
   ===================================================================== */
const f1 = v => Math.round(v * 10) / 10;
const AM = {
  mul: (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]],
  t: (x, y) => [1, 0, 0, 1, x, y], s: (sx, sy = sx) => [sx, 0, 0, sy, 0, 0],
  r: d => { const c = Math.cos(d * D2R), s = Math.sin(d * D2R); return [c, s, -s, c, 0, 0]; }
};
const pC = (cx, cy, r) => `M${f1(cx - r)} ${f1(cy)}a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0Z`;
const pE = (cx, cy, rx, ry) => `M${f1(cx - rx)} ${f1(cy)}a${f1(rx)} ${f1(ry)} 0 1 0 ${f1(2 * rx)} 0a${f1(rx)} ${f1(ry)} 0 1 0 ${f1(-2 * rx)} 0Z`;
const pPL = pts => 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z';
const pRR = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); return `M${f1(x + r)} ${f1(y)}H${f1(x + w - r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w)} ${f1(y + r)}V${f1(y + h - r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w - r)} ${f1(y + h)}H${f1(x + r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x)} ${f1(y + h - r)}V${f1(y + r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + r)} ${f1(y)}Z`; };
const pStar = (cx, cy, R, r = R * .45, rot = -90, n = 5) => pPL(Array.from({ length: n * 2 }, (_, i) => { const a = (rot + i * 180 / n) * D2R, rr = i % 2 ? r : R; return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; }));
const pArc = (cx, cy, r1, r2, a0, a1, n = 24) => { const o = [], ii = []; for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * D2R; o.push([cx + Math.cos(a) * r2, cy + Math.sin(a) * r2]); ii.push([cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]); } return pPL([...o, ...ii.reverse()]); };
const wav = (y, amp, fr, ph, x0 = 0, x1 = 1000, step = 20) => { const pts = []; for (let x = x0; x < x1; x += step) pts.push([x, y + amp * Math.sin(x * fr + ph)]); pts.push([x1, y + amp * Math.sin(x1 * fr + ph)]); return pts; };
const HEART_D = 'M50 88 C20 66 7 50 7 32 C7 18 18 9 31 9 C40 9 46 15 50 22 C54 15 60 9 69 9 C82 9 93 18 93 32 C93 50 80 66 50 88Z';
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
class Pic {
  constructor(seed) { this.regions = []; this.m = null; this.st = []; this.rnd = mulberry(seed); }
  push(m) { this.st.push(this.m); this.m = this.m ? AM.mul(this.m, m) : m; }
  pop() { this.m = this.st.pop(); }
  at(x, y, s = 1, rot = 0, flip = false) { let m = AM.t(x, y); if (rot) m = AM.mul(m, AM.r(rot)); m = AM.mul(m, AM.s(flip ? -s : s, s)); this.push(m); }
  add(d, c) { this.regions.push({ d, c, tf: this.m }); return this; }
  R(a, b) { return a + this.rnd() * (b - a); }
}

/* ---- scenery parts ---- */
function band(p, y, amp, fr, ph, color, cuts = [], shades = [], yb = 1000) {
  p.add(pPL([...wav(y, amp, fr, ph), [1000, yb], [0, yb]]), color);
  cuts.forEach((cx, j) => {
    const top = wav(y, amp, fr, ph, cx, 1000), yTop = y + amp * Math.sin(cx * fr + ph), side = [];
    for (let yy = yb; yy > yTop + 2; yy -= 25) side.push([cx + 14 * Math.sin(yy * .021 + j * 1.7), yy]);
    side.push([cx, yTop]);
    p.add(pPL([...top, [1000, yb], ...side]), shades[j % shades.length]);
  });
}
function sun(p, cx, cy, r, rays, c1, c2, core, inner) {
  for (let i = 0; i < rays; i++) { const a = i * 360 / rays, w = 180 / rays * .55; p.add(pPL([[cx + Math.cos((a - w) * D2R) * r * 1.08, cy + Math.sin((a - w) * D2R) * r * 1.08], [cx + Math.cos(a * D2R) * r * 1.62, cy + Math.sin(a * D2R) * r * 1.62], [cx + Math.cos((a + w) * D2R) * r * 1.08, cy + Math.sin((a + w) * D2R) * r * 1.08]]), i % 2 ? c2 : c1); }
  p.add(pC(cx, cy, r), core); p.add(pC(cx, cy, r * .68), inner);
}
function cloud(p, x, y, s, c1, c2) {
  p.add(pE(x, y + 14 * s, 96 * s, 30 * s), c2);
  [[-62, 2, 38], [-22, -24, 48], [30, -18, 44], [68, 6, 32]].forEach(([dx, dy, r], i) => p.add(pC(x + dx * s, y + dy * s, r * s), i % 2 ? c2 : c1));
}
function flower(p, x, y, s, petal, center, n = 6, petal2 = null, stem = '#4fa37f', leaf = '#7fd38f') {
  p.add(pRR(x - 4 * s, y, 8 * s, 150 * s, 4 * s), stem);
  p.at(x - 22 * s, y + 70 * s, 1, -35); p.add(pE(0, 0, 26 * s, 11 * s), leaf); p.pop();
  p.at(x + 22 * s, y + 100 * s, 1, 35); p.add(pE(0, 0, 26 * s, 11 * s), leaf); p.pop();
  for (let i = 0; i < n; i++) { p.at(x, y, 1, i * 360 / n); p.add(pE(0, -30 * s, 14 * s, 25 * s), petal2 && i % 2 ? petal2 : petal); p.pop(); }
  p.add(pC(x, y, 15 * s), center);
}
function pine(p, x, y, s, c1, c2, trunk) {
  p.add(pRR(x - 9 * s, y - 20 * s, 18 * s, 50 * s, 4 * s), trunk);
  [[0, 90, 120], [-60, 72, 96], [-115, 54, 72]].forEach(([dy, w, h], i) => p.add(pPL([[x - w * s, y + dy * s], [x, y + (dy - h) * s], [x + w * s, y + dy * s]]), i % 2 ? c2 : c1));
}
function tree(p, x, y, s, trunk, leaves, fruit) {
  p.add(pPL([[x - 26 * s, y], [x - 14 * s, y - 190 * s], [x + 14 * s, y - 190 * s], [x + 26 * s, y]]), trunk);
  [[-90, -230, 70], [0, -280, 90], [90, -230, 70], [-50, -170, 62], [55, -170, 62], [-130, -175, 50], [130, -175, 50], [0, -200, 66], [-40, -320, 58], [45, -320, 58]].forEach(([dx, dy, r], i) => p.add(pC(x + dx * s, y + dy * s, r * s), leaves[i % leaves.length]));
