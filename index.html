<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Garden">
<meta name="theme-color" content="#2e1a47">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lydia's Dino Garden</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen dusk garden. Hub = Lydia's name, her dino, five portals. Rooms swap in over the same scenery. Single deliberate dusk theme. */
:root{
  --plum-deep:#2e1a47; --plum:#5a2f72; --rose:#c86a9e; --blush:#f6b3c8; --peach:#ffd9c4; --cream:#fff7f3;
  --dino:#a77be8; --dino-dark:#7d52c4; --belly:#ffc4de; --spot:#ff8fc2; --mint:#7fd8c3; --gold:#ffd27a;
  --glass:rgba(255,247,243,.14); --glass-edge:rgba(255,247,243,.34);
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --sz:clamp(84px,19vmin,180px);
  --p:clamp(68px,13.5vmin,146px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--plum-deep);color:var(--cream);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;border:none;background:none;padding:0;touch-action:none}
button:focus-visible{outline:4px solid var(--gold);outline-offset:4px}

/* ---------- scenery ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#2e1a47 0%,#4f2a69 30%,#93508a 58%,#e091ad 78%,#ffd0bd 100%)}
.sun{position:absolute;left:50%;bottom:24vh;width:58vmin;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fff0e4 0 26%,rgba(255,222,204,.75) 36%,rgba(255,200,200,.25) 52%,transparent 70%)}
#twinkles span{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cream);opacity:.2;animation:twinkle 4s ease-in-out infinite}
.hills{position:absolute;left:0;bottom:0;width:100%;height:44vh}
#bokeh span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,220,236,.35),transparent 70%);animation:drift 18s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,-5vh)}}

/* ---------- app shell ---------- */
#app{position:fixed;inset:0;z-index:1;transition:opacity .4s ease,transform .4s ease}
#app.dim{opacity:0;transform:scale(.97)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 96px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 3vh) max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
.ui-btn{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 18px);width:68px;height:68px;border-radius:50%;
  display:grid;place-items:center;background:var(--glass);border:2px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 24px rgba(20,6,38,.35)}
.ui-btn svg{width:34px;height:34px}
.ui-btn:active{transform:scale(.92)}
#homeBtn{left:max(18px,calc(env(safe-area-inset-left,0px) + 18px))}
#soundBtn{right:max(18px,calc(env(safe-area-inset-right,0px) + 18px))}
#soundBtn.off{opacity:.55}

/* ---------- dino ---------- */
.dino{display:block;overflow:visible;filter:drop-shadow(0 18px 18px rgba(20,6,38,.35))}
#dino .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5%) scale(1.01)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16%) scale(.96,1.05)}65%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}

/* ---------- hub ---------- */
#hub{justify-content:space-between;gap:2vh}
.name{display:flex;gap:.04em;font-size:clamp(64px,14vmin,160px);font-weight:700;line-height:1}
.name span{display:inline-block;padding:0 .02em;cursor:pointer;text-shadow:0 .06em 0 rgba(46,26,71,.45),0 0 .5em rgba(255,200,230,.35)}
.name span.bounce{animation:letter .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes letter{0%{transform:none}35%{transform:translateY(-22%) scale(1.15) rotate(-6deg)}100%{transform:none}}
.hub-dino{width:min(40vmin,370px);flex:none;cursor:pointer}
.portals{display:grid;grid-template-columns:repeat(6,auto);gap:clamp(12px,3vmin,34px);padding-bottom:1vh}
.portal{width:var(--p);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),transparent 42%),var(--c);
  box-shadow:0 16px 30px rgba(20,6,38,.45),inset 0 -10px 20px rgba(46,26,71,.22),0 0 0 7px rgba(255,247,243,.16);
  animation:float 4.6s ease-in-out infinite}
.portal:nth-child(2){animation-delay:-.8s}.portal:nth-child(3){animation-delay:-1.6s}.portal:nth-child(4){animation-delay:-2.4s}.portal:nth-child(5){animation-delay:-3.2s}.portal:nth-child(6){animation-delay:-4s}
.portal>svg{width:56%;height:56%;pointer-events:none}
.portal:active{transform:scale(.92)}
.portal .badge{position:absolute;top:-8%;right:-8%;width:42%;height:42%;opacity:0;transform:scale(0) rotate(-40deg);transition:.5s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.portal.done .badge{opacity:1;transform:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- room shared ---------- */
#roomBody{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.room-star{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;width:76px;height:76px;margin-left:-38px;
  transform:scale(0) rotate(-60deg);transition:transform .6s cubic-bezier(.3,1.7,.5,1);pointer-events:none;filter:drop-shadow(0 6px 14px rgba(255,210,122,.6))}
.room-star.show{transform:none}
.slot{width:var(--sz);aspect-ratio:1;position:relative;flex:none}
.piece{position:absolute;inset:0;z-index:2;cursor:grab;touch-action:none;filter:drop-shadow(0 12px 12px rgba(20,6,38,.45));will-change:transform}
.piece svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.piece.dragging{z-index:60;filter:drop-shadow(0 26px 22px rgba(20,6,38,.5))}
.settle{animation:settle .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes settle{0%{transform:scale(1.15)}50%{transform:scale(.92)}100%{transform:none}}
.wiggle{animation:wiggle .7s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.panel{border-radius:44px;background:var(--glass);border:2px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 24px 50px rgba(20,6,38,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:box-shadow .5s}
.panel.win{box-shadow:0 0 0 6px rgba(255,210,122,.6),0 0 70px rgba(255,210,122,.55)}

/* music */
.music{display:flex;align-items:flex-end;gap:3vmin;height:min(72vh,640px);width:min(100%,1120px);position:relative}
.music .dino{width:24vmin;flex:none}
.tubes{display:flex;align-items:flex-end;gap:clamp(6px,1.6vmin,18px);height:100%;flex:1;min-width:0}
.tube{flex:1;min-width:0;border-radius:999px 999px 30px 30px;position:relative;
  background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 30%,transparent 62%,rgba(46,26,71,.18)),var(--c);
  box-shadow:0 12px 26px rgba(20,6,38,.42);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .35s,filter .35s}
.tube::before{content:"";position:absolute;left:18%;right:18%;top:5%;height:7%;border-radius:50%;background:rgba(255,255,255,.55)}
.tube.lit{transform:translateY(-12px) scale(1.04);filter:brightness(1.15);box-shadow:0 12px 26px rgba(20,6,38,.42),0 0 46px 12px var(--c)}
.note{position:absolute;z-index:5;font-size:clamp(34px,6vmin,60px);font-weight:700;pointer-events:none;animation:noteUp 1.6s ease-out forwards;text-shadow:0 4px 10px rgba(20,6,38,.4)}
@keyframes noteUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-34vh) scale(1.2) rotate(18deg)}}

/* shapes + eggs */
.shapes,.eggs-room{display:flex;flex-direction:column;align-items:center;gap:6vh}
.board{display:flex;gap:4.5vmin;padding:4vmin 5vmin}
.hole{width:var(--sz);aspect-ratio:1;position:relative}
.hole>svg{width:100%;height:100%;display:block}
.hole .piece{filter:drop-shadow(0 4px 6px rgba(20,6,38,.35));cursor:default}
.tray{display:flex;gap:6vmin;flex-wrap:wrap;justify-content:center}
.nests{display:flex;gap:4vmin;align-items:flex-end;padding:3vmin 4vmin 2vmin}
.nest{width:calc(var(--sz)*1.4);aspect-ratio:1.3/1;position:relative}
.nest::before{content:"";position:absolute;inset:-6% -2% 10%;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 66%);opacity:.45}
.nest .bowl{position:absolute;left:0;bottom:0;width:100%;z-index:4;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(20,6,38,.35))}
.nest .slots{position:absolute;left:14%;right:14%;bottom:22%;height:62%;display:flex;justify-content:center;align-items:flex-end;gap:4%;z-index:3}
.nest .slots .piece{position:relative;inset:auto;width:44%;aspect-ratio:100/104;flex:none;cursor:default;filter:drop-shadow(0 4px 5px rgba(20,6,38,.3))}
.egg-tray .slot{width:calc(var(--sz)*.62);aspect-ratio:100/104}
.egg-tray{gap:3.5vmin}
.hatched svg{transform:scale(1.5) translateY(-8%);animation:hatch .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes hatch{0%{transform:scale(.2) translateY(30%)}100%{transform:scale(1.5) translateY(-8%)}}

/* learn path */
.learn-map{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;width:100%;height:100%}
.unit-tabs{display:flex;gap:clamp(8px,1.6vmin,16px);padding:8px;border-radius:999px;background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.utab{width:clamp(58px,9.5vmin,88px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;font-weight:700;font-size:clamp(17px,2.8vmin,26px);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.45),transparent 45%),var(--c);opacity:.6;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s,box-shadow .3s}
.utab svg{width:56%;height:56%;pointer-events:none}
.utab.on{opacity:1;transform:scale(1.1);box-shadow:0 0 0 4px var(--cream),0 10px 22px rgba(20,6,38,.4)}
.utab .prog{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);min-width:30px;padding:1px 7px;border-radius:999px;background:var(--plum-deep);color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums;border:2px solid rgba(255,247,243,.4)}
.unit-title{font-size:clamp(30px,5.4vmin,54px);font-weight:700;line-height:1;text-shadow:0 4px 0 rgba(46,26,71,.35)}
.unit-sub{font-size:clamp(15px,2.2vmin,20px);opacity:.85;margin-top:-1.2vh}
.stones{display:flex;gap:clamp(12px,2.8vmin,34px);align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:min(100%,1100px);padding-bottom:7vh;position:relative}
.stone{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(92px,14vmin,146px);position:relative}
.stone:nth-child(even){margin-top:6.5vh}
.stone .disc{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;font-weight:700;font-size:clamp(26px,5vmin,46px);
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),transparent 45%),var(--c);
  box-shadow:0 14px 26px rgba(20,6,38,.4),inset 0 -8px 16px rgba(46,26,71,.22),0 0 0 6px rgba(255,247,243,.16)}
.stone .disc svg{width:56%;height:56%;pointer-events:none;overflow:visible}
.stone .disc .emoji{font-size:clamp(34px,6vmin,58px)}
.stone .label{font-size:clamp(14px,2.1vmin,19px);font-weight:600;text-align:center;line-height:1.15;text-wrap:balance;text-shadow:0 1px 2px rgba(46,26,71,.9),0 2px 10px rgba(46,26,71,.75)}
.unit-sub,.unit-title{text-shadow:0 1px 2px rgba(46,26,71,.9),0 2px 12px rgba(46,26,71,.7)}
.stone .badge{position:absolute;top:-6%;right:-6%;width:38%;height:38%;filter:drop-shadow(0 3px 6px rgba(20,6,38,.4))}
.stone.next .disc{animation:ring 1.6s ease-in-out infinite}
.stone .here{position:absolute;top:-14%;left:-30%;width:54%;animation:float 2.4s ease-in-out infinite;pointer-events:none}
.stone:active .disc{transform:scale(.93)}
@keyframes ring{0%,100%{box-shadow:0 14px 26px rgba(20,6,38,.4),0 0 0 6px rgba(255,210,122,.55)}50%{box-shadow:0 14px 26px rgba(20,6,38,.4),0 0 0 15px rgba(255,210,122,.12)}}
.voicebtn{position:fixed;z-index:29;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border-radius:999px;font-weight:600;font-size:16px;
  background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.voicebtn svg{width:26px;height:26px}
.voice-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(30,12,50,.55);padding:20px}
.voice-panel{width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column;gap:12px;padding:22px;background:rgba(58,35,99,.92)}
.vp-title{font-size:26px;font-weight:700}
.vp-sub{font-size:15px;opacity:.85;line-height:1.3}
.vp-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.vp-row{text-align:left;padding:14px 16px;border-radius:16px;background:rgba(255,247,243,.1);border:2px solid rgba(255,247,243,.2);font-size:17px;font-weight:500}
.vp-row b{margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--plum-deep);font-size:12px;vertical-align:2px}
.vp-row.on{background:var(--cream);color:var(--plum-deep);border-color:var(--cream)}
.vp-done{align-self:center;height:50px;padding:0 34px;border-radius:999px;background:var(--gold);color:var(--plum-deep);font-weight:700;font-size:18px}
.lesson{display:flex;flex-direction:column;align-items:center;gap:2.2vh;width:100%;height:100%}
.lesson-top{display:flex;align-items:center;gap:14px;flex:none}
.lbtn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lbtn svg{width:30px;height:30px}
.lbtn:active{transform:scale(.9)}
.dots{display:flex;gap:9px;padding:0 6px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,247,243,.25);transition:background .3s,transform .3s}
.dots i.on{background:var(--gold);transform:scale(1.15)}
.prompt{font-size:clamp(24px,4.2vmin,42px);font-weight:600;text-align:center;text-wrap:balance;min-height:1.2em;flex:none;max-width:900px}
.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh}
.choices{display:flex;gap:clamp(14px,3.6vmin,40px);justify-content:center;flex-wrap:wrap}
.choice{width:clamp(108px,21vmin,200px);aspect-ratio:1;border-radius:clamp(24px,4vmin,36px);display:grid;place-items:center;color:var(--plum-deep);font-weight:700;font-size:clamp(46px,10vmin,104px);line-height:1;
  background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 14px 28px rgba(20,6,38,.38);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .4s,box-shadow .3s}
.choice.word{font-size:clamp(34px,6.4vmin,62px);letter-spacing:.04em}
.choice.small{font-size:clamp(30px,5.4vmin,52px)}
.choice svg{width:78%;height:78%;pointer-events:none}
.choice .emoji{font-size:clamp(56px,11vmin,110px)}
.choice:active{transform:scale(.94)}
.choice.right{transform:scale(1.08);box-shadow:0 0 0 7px var(--gold),0 0 46px rgba(255,210,122,.75)}
.choice.wrong{opacity:.35;animation:wiggle .55s ease-in-out}
.show{width:clamp(150px,30vmin,300px);aspect-ratio:1;border-radius:clamp(28px,5vmin,48px);display:grid;place-items:center;color:var(--plum-deep);font-weight:700;font-size:clamp(80px,17vmin,170px);line-height:1;
  background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 18px 34px rgba(20,6,38,.38)}
.show svg{width:84%;height:84%}
.show .emoji{font-size:clamp(90px,18vmin,180px)}
.show.word{width:auto;aspect-ratio:auto;padding:3vmin 6vmin;font-size:clamp(60px,12vmin,120px);letter-spacing:.06em}
.meet{display:flex;flex-direction:column;align-items:center;gap:2.6vh}
.meet .card{width:min(52vmin,460px);aspect-ratio:1;border-radius:clamp(32px,6vmin,56px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;color:var(--plum-deep);
  background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 22px 40px rgba(20,6,38,.4);text-align:center;padding:3vmin;box-sizing:border-box}
.meet .card.pop{animation:settle .6s cubic-bezier(.3,1.7,.5,1)}
.meet .big{font-size:clamp(90px,19vmin,190px);font-weight:700;line-height:1}
.meet .big svg{width:min(30vmin,260px);height:min(30vmin,260px)}
.meet .cap{font-size:clamp(24px,4.4vmin,42px);font-weight:600;line-height:1.1}
.meet .big-e{font-size:clamp(64px,12vmin,120px)}
.meet .big.letters{font-size:clamp(70px,14vmin,140px);letter-spacing:.04em}
.meet .row{display:flex;flex-wrap:wrap;justify-content:center;gap:.4vmin;max-width:90%}
.meet .row .emoji{font-size:clamp(30px,5.6vmin,54px);transition:transform .3s,filter .3s}
.meet .row .emoji.lit{transform:scale(1.3);filter:drop-shadow(0 0 10px #ffd27a)}
.meet .letters span{display:inline-block;transition:transform .3s,color .3s}
.meet .letters span.lit{transform:translateY(-12%) scale(1.15);color:#e2679f}
.nextbtn{width:clamp(76px,11vmin,96px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),transparent 45%),var(--gold);box-shadow:0 12px 24px rgba(20,6,38,.4)}
.nextbtn svg{width:46%;height:46%}
.nextbtn.glow{animation:ring 1.4s ease-in-out infinite}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-block}
.tens{display:flex;flex-direction:column;gap:clamp(6px,1.2vmin,12px);align-items:flex-start;margin:0 auto}
.tenrow{display:flex;gap:clamp(4px,.9vmin,9px)}
.dot{width:clamp(18px,3vmin,30px);aspect-ratio:1;border-radius:50%;background:#c9a6ff;box-shadow:inset 0 -3px 0 rgba(46,26,71,.2);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s;flex:none}
.tenrow:nth-child(2) .dot{background:#ffb070}.tenrow:nth-child(3) .dot{background:#7fd8c3}
.dot.lit,.dot.on{background:var(--gold)!important;transform:scale(1.18);box-shadow:0 0 10px rgba(255,210,122,.9)}
.stage .tens .dot{width:clamp(30px,5.4vmin,52px)}
.meet .tens .dot{width:clamp(16px,2.8vmin,28px)}
.count-badge{font-size:clamp(40px,7vmin,70px);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 4px 0 rgba(46,26,71,.4);font-variant-numeric:tabular-nums}
.stones.many .stone{width:clamp(78px,11vmin,118px)}
.stones.many .stone:nth-child(even){margin-top:5vh}
.stones.many{gap:clamp(10px,2vmin,24px) clamp(10px,2.2vmin,26px);max-width:min(100%,calc(6 * clamp(78px,11vmin,118px) + 5 * clamp(10px,2.2vmin,26px) + 4px))}
.count-items{display:flex;flex-wrap:wrap;gap:clamp(6px,1.6vmin,18px);justify-content:center;max-width:min(92%,820px)}
.citem{position:relative;font-size:clamp(46px,8.6vmin,84px);transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .3s}
.citem.on{transform:scale(1.18);filter:drop-shadow(0 0 12px #ffd27a)}
.citem b{position:absolute;top:-30%;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.42em;color:var(--gold);text-shadow:0 2px 0 rgba(46,26,71,.5)}
.word-slots,.word-tiles{display:flex;gap:clamp(10px,2vmin,20px);justify-content:center;flex-wrap:wrap}
.wslot,.wtile{width:clamp(70px,12vmin,116px);aspect-ratio:1;border-radius:clamp(18px,3vmin,28px);display:grid;place-items:center;font-weight:700;font-size:clamp(40px,7.6vmin,74px);line-height:1}
.wslot{border:4px dashed rgba(255,247,243,.5);color:var(--cream)}
.wslot.filled{border-style:solid;border-color:var(--gold);background:var(--cream);color:var(--plum-deep);animation:settle .5s cubic-bezier(.3,1.7,.5,1)}
.wtile{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),transparent 45%),var(--c,#a77be8);color:#fff;box-shadow:0 10px 20px rgba(20,6,38,.38);transition:opacity .3s,transform .25s}
.wtile.used{opacity:0;transform:scale(.6);pointer-events:none}
.wtile.nope{animation:wiggle .5s ease-in-out}
.clock-wrap{width:min(46vmin,400px);aspect-ratio:1;touch-action:none}
.clock-wrap svg{width:100%;height:100%;filter:drop-shadow(0 18px 26px rgba(20,6,38,.4))}
.choice .clock-mini{width:86%;height:86%}

/* art: gallery, color by number, paint */
.art-home{display:flex;flex-direction:column;align-items:center;gap:2.4vh;width:100%;height:100%}
.art-tabs{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);flex:none}
.art-tab{height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:clamp(16px,2.4vmin,20px);display:flex;align-items:center;gap:10px}
.art-tab svg{width:28px;height:28px}
.art-tab.on{background:var(--cream);color:var(--plum-deep)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,19vmin,190px),1fr));gap:clamp(12px,2.4vmin,24px);width:min(100%,1100px);flex:1;min-height:0;align-content:start;overflow:hidden}
.gcard{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:8px;border-radius:24px;background:var(--glass);border:2px solid var(--glass-edge);position:relative}
.gcard .thumb{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff}
.gcard .thumb svg{width:100%;height:100%;display:block}
.gcard .gname{font-size:clamp(13px,1.9vmin,16px);font-weight:600;text-align:center;line-height:1.1}
.gcard .gbar{height:7px;border-radius:9px;background:rgba(255,247,243,.2);overflow:hidden}
.gcard .gbar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.gcard .badge{position:absolute;top:-10px;right:-10px;width:44px;height:44px;filter:drop-shadow(0 4px 8px rgba(20,6,38,.4))}
.gcard:active{transform:scale(.96)}
.gcard .gtag{position:absolute;top:-12px;left:-10px;font-size:30px;filter:drop-shadow(0 3px 5px rgba(20,6,38,.45))}
.gallery{overflow-y:auto;touch-action:pan-y;padding:12px 6px 40px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.gallery .gcard{touch-action:pan-y}
.gallery .gcard *{pointer-events:none}
.cbn{display:flex;flex-direction:column;align-items:center;gap:1.4vh;width:100%;height:100%}
.cbn-top{display:flex;align-items:center;gap:12px;flex:none}
.cbn-pct{min-width:84px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.cbn-view{flex:1;min-height:0;width:100%;position:relative;overflow:hidden;border-radius:28px;background:rgba(255,247,243,.1);border:2px solid var(--glass-edge);touch-action:none}
.cbn-inner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cbn-inner svg{width:100%;height:100%;display:block;background:#fff;border-radius:6px;box-shadow:0 16px 40px rgba(20,6,38,.35)}
.cbn-inner text{font-family:var(--display);font-weight:600;pointer-events:none;dominant-baseline:central}
.cbn-inner .lbl.sel{fill:#3b2a55;font-weight:700}
.cbn-inner .lbl.pulse{animation:lblpulse .9s ease-in-out 3}
@keyframes lblpulse{50%{fill:#ff5fa2}}
.cbn-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:10px;z-index:2}
.cbn-tools .lbtn{background:rgba(46,26,71,.55)}
.cbn-pal{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vmin,12px);flex:none;max-width:100%;padding:4px}
.sw{width:clamp(46px,7.2vmin,66px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:clamp(17px,2.6vmin,24px);position:relative;
  box-shadow:0 6px 14px rgba(20,6,38,.35),inset 0 0 0 3px rgba(255,255,255,.55);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.sw.on{transform:scale(1.18);box-shadow:0 0 0 4px var(--cream),0 8px 18px rgba(20,6,38,.4)}
.sw.done{opacity:.5}
.sw.done::after{content:"";position:absolute;inset:28%;border-right:4px solid currentColor;border-bottom:4px solid currentColor;transform:rotate(40deg) translate(-8%,-14%);width:22%;left:38%;border-radius:2px}
.sw.done span{display:none}
.sw.hint{animation:wiggle .6s ease-in-out 2}
.paint{display:flex;gap:2vmin;width:100%;height:100%;align-items:center;justify-content:center}
.paint-board{position:relative;aspect-ratio:1;height:100%;max-width:100%;max-height:100%;border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(20,6,38,.4);background:#fff;flex:none;touch-action:none}
.paint-board canvas,.paint-board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.paint-board svg{pointer-events:none}
.paint-side{display:flex;flex-direction:column;gap:1.2vmin;padding:1.4vmin;border-radius:28px;flex:none;align-self:center;max-height:100%}
.pcolors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 4px 10px rgba(20,6,38,.3)}
.pc.on{box-shadow:0 0 0 4px var(--cream),0 4px 10px rgba(20,6,38,.3)}
.ptools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pt{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:rgba(255,247,243,.12);border:2px solid rgba(255,247,243,.22)}
.pt svg{width:66%;height:66%}
.pt.on{background:var(--cream);border-color:var(--cream)}
.pt.on svg [stroke="#fff7f3"]{stroke:#2e1a47}.pt.on svg [fill="#fff7f3"]{fill:#2e1a47}
.pt.clear::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:4px solid var(--gold);clip-path:inset(100% 0 0 0);pointer-events:none}
.pt.clear{position:relative}
.pt.clear.holding::after{animation:fillup .9s linear forwards}
.psizes{display:flex;justify-content:space-around;align-items:center;gap:8px}
.psz{width:clamp(34px,5.4vmin,50px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,247,243,.12)}
.psz i{display:block;border-radius:50%;background:var(--cream)}
.psz.on{background:var(--cream)}.psz.on i{background:var(--plum-deep)}
@media (orientation:portrait){.paint{flex-direction:column}.paint-board{height:auto;width:100%}.paint-side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-self:stretch}.pcolors{grid-template-columns:repeat(8,1fr)}.ptools{grid-template-columns:repeat(8,1fr)}}

/* build-a-run */
.build{display:flex;gap:2.2vmin;width:100%;height:100%;align-items:stretch}
.board-wrap{flex:1;min-width:0;min-height:0;position:relative}
.board-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ptray{display:grid;grid-template-columns:repeat(2,auto);gap:1.2vmin;padding:1.6vmin;align-content:center;justify-content:center;border-radius:32px;flex:none;align-self:center}
.pbtn{width:clamp(54px,9.4vmin,92px);aspect-ratio:1;border-radius:22px;background:rgba(255,247,243,.1);border:2px solid rgba(255,247,243,.22);display:grid;place-items:center;position:relative}
.pbtn svg{width:84%;height:84%;pointer-events:none;overflow:visible}
.pbtn:active{transform:scale(.92)}
.pbtn.clear::after{content:"";position:absolute;inset:-5px;border-radius:25px;border:4px solid var(--gold);clip-path:inset(100% 0 0 0);pointer-events:none}
.pbtn.clear.holding::after{animation:fillup .9s linear forwards}
@keyframes fillup{to{clip-path:inset(0 0 0 0)}}
.ghost{position:fixed;left:0;top:0;width:96px;height:96px;z-index:65;pointer-events:none;filter:drop-shadow(0 16px 16px rgba(20,6,38,.45))}
.ghost svg{width:100%;height:100%;overflow:visible;display:block}
@media (orientation:portrait){.build{flex-direction:column}.ptray{grid-template-columns:repeat(9,auto)}}
@media (orientation:portrait) and (max-width:700px){.ptray{grid-template-columns:repeat(5,auto)}}

/* matching game */
.match-bar{position:fixed;z-index:29;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  max-width:calc(100vw - 210px);overflow-x:auto;padding:4px}
.chipset{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:2px solid var(--glass-edge);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip{height:46px;min-width:46px;padding:0 12px;border-radius:999px;font-weight:600;font-size:17px;color:var(--cream);display:grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:30px;height:30px;pointer-events:none}
.chip.on{background:var(--cream);color:var(--plum-deep);box-shadow:0 4px 12px rgba(20,6,38,.3)}
.chip.on svg [fill="#fff7f3"]{fill:var(--plum-deep)}
.chip.on svg [stroke="#fff7f3"]{stroke:var(--plum-deep)}
.chip.on svg [fill="#e4d4f4"]{fill:#7d52c4}
.mgrid{display:grid;gap:var(--gap);justify-content:center;align-content:center}
.mcard{width:var(--cs);height:var(--cs);perspective:700px;position:relative}
.mcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.3,.5,1)}
.mcard.up .inner{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:calc(var(--cs)*.2);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.mcard .back{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 45%),linear-gradient(160deg,#b98ae8,#7d52c4);
  box-shadow:0 calc(var(--cs)*.06) calc(var(--cs)*.12) rgba(20,6,38,.4),inset 0 0 0 calc(var(--cs)*.04) rgba(255,247,243,.35)}
.mcard .back svg{width:46%;height:46%;opacity:.55}
.mcard .front{transform:rotateY(180deg);background:linear-gradient(170deg,#fffaf6,#ffe9f1);box-shadow:0 calc(var(--cs)*.05) calc(var(--cs)*.1) rgba(20,6,38,.35)}
.mcard .front svg{width:84%;height:84%}
.mcard.got .front{box-shadow:0 0 0 calc(var(--cs)*.05) var(--gold),0 0 calc(var(--cs)*.3) rgba(255,210,122,.7)}
.mcard.got .inner{animation:gotit .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes gotit{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.14)}100%{transform:rotateY(180deg) scale(1)}}
.mcard.free .inner{transform:rotateY(180deg)}
.mcard.free .front{background:radial-gradient(circle,#fff3c8,#ffd27a)}

/* travel + finale + confetti */
#travel{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#travel .runner{position:absolute;left:0;bottom:16vh;width:28vmin;transform:translateX(-40vmin)}
#travel .runner.go{animation:run 1.3s cubic-bezier(.45,.05,.55,.95) forwards}
#travel .runner.go svg{animation:trot .26s ease-in-out infinite}
@keyframes run{to{transform:translateX(calc(100vw + 10vmin))}}
@keyframes trot{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14%) rotate(4deg)}}
#finale{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  background:radial-gradient(circle at 50% 55%,rgba(255,208,189,.35),rgba(46,26,71,.6) 70%);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#finale .dino{width:min(50vmin,440px);animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}25%{transform:rotate(0) translateY(-10%)}50%{transform:rotate(6deg) translateY(0)}75%{transform:rotate(0) translateY(-10%)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}

@media (max-width:560px){.portals{grid-template-columns:repeat(3,auto)}.music .dino{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="scene" aria-hidden="true">
  <div id="twinkles"></div>
  <div class="sun"></div>
  <div id="bokeh"></div>
  <svg class="hills" viewBox="0 0 1200 400" preserveAspectRatio="none">
    <path d="M0 210 C150 150 300 170 420 200 C560 235 680 150 820 160 C960 170 1080 220 1200 190 L1200 400 L0 400Z" fill="#a3609a" opacity=".8"/>
    <path d="M0 270 C180 220 330 250 480 270 C640 292 760 225 920 235 C1050 243 1130 270 1200 262 L1200 400 L0 400Z" fill="#74407f"/>

</div>

<div id="app">
  <section id="hub" class="screen">
    <div class="name" id="hubName" aria-label="Lydia"></div>
    <svg class="dino hub-dino breathe" id="hubDino" viewBox="0 0 230 200" role="img" aria-label="Lydia's dinosaur"><use href="#dino"/></svg>
    <div class="portals">
      <button class="portal" data-room="build" style="--c:#e2679f" aria-label="Build a marble run">
        <svg viewBox="0 0 100 100"><g fill="none" stroke="#fff7f3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 30 L60 44" stroke-width="13" stroke-opacity=".45"/><path d="M88 58 L40 72" stroke-width="13" stroke-opacity=".45"/><path d="M12 36 L60 50 M88 64 L40 78" stroke-width="5"/></g><circle cx="24" cy="20" r="11" fill="#fff7f3"/><circle cx="21" cy="17" r="3.5" fill="#e2679f" opacity=".6"/></svg>

      <button class="portal" data-room="music" style="--c:#ff8fc2" aria-label="Music">

        <svg class="badge"><use href="#star"/></svg>

      <button class="portal" data-room="nests" style="--c:#5fc9b1" aria-label="Eggs">
        <svg viewBox="0 0 100 104"><path d="M50 6 C74 6 90 44 90 66 C90 86 72 98 50 98 C28 98 10 86 10 66 C10 44 26 6 50 6Z" fill="#fff7f3"/><g fill="#5fc9b1" opacity=".55"><circle cx="38" cy="46" r="7"/><circle cx="62" cy="64" r="9"/><circle cx="40" cy="78" r="5"/></g></svg>

  <section id="room" class="screen" hidden>

    for (let k = 0; k < full; k++) parts.push({ t: numWord((k + 1) * 10), rate: .85, on: () => { lit = lit.concat($$('.dot', rows[k])); lit.forEach(q => q.classList.add('lit')); } });

/* =====================================================================

const f1 = v => Math.round(v * 10) / 10;

const pPL = pts => 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z';
const pRR = (x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); return `M${f1(x + r)} ${f1(y)}H${f1(x + w - r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w)} ${f1(y + r)}V${f1(y + h - r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + w - r)} ${f1(y + h)}H${f1(x + r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x)} ${f1(y + h - r)}V${f1(y + r)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x + r)} ${f1(y)}Z`; };

    else if (STAMPS[stampI] === 'heart') { ctx.save(); ctx.translate(x - s / 2, y - s / 2); ctx.scale(s / 100, s / 100); ctx.fillStyle = color; ctx.fill(new Path2D(HEART_D)); ctx.restore(); sfx.boing(.1); }

}
window.__dinoArt = { PICS, prepPic, picSVG, built };

/* ---------------- boot ---------------- */
function start(data) { ((data && data.stars) || []).forEach(s => done.add(s)); refreshHub(); }
try { window.claude?.hot?.snapshot?.(() => ({ stars: [...done] })); } catch (e) {}

})();
